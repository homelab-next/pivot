schema: pivot.connector/1
id: synapse
version: 0.1.0
description: >
  The primary graph. Native pivots (every property->form link and light edge in the model) are
  generated by tools/derive_native_pivots.py and are not listed here; these methods are the
  investigation-level operations on top. Transport: Synapse native MCP (/api/v1/mcp) as the
  read-only hermes-mcp-ro user; writes go only to the investigation's forked view.
kind: graph
egress: internal
independence_group: synapse-mixed   # overridden per node by its meta:source (misp-daily-feed, cti-agent-graph-sync, ...)
handling: {default_tlp: amber}
gaps:
  - "inet:http:cookie has no inbound property pivots in the 2.247.0 model"
methods:
  - name: neighbours
    description: All property pivots and light edges, both directions, one hop.
    accepts: [inet:ipv4, inet:ipv6, inet:fqdn, inet:url, hash:sha256, hash:md5, hash:sha1, inet:email, inet:tls:ja4, risk:threat, risk:tool:software, ou:campaign]
    emits: {forms: [inet:ipv4, inet:fqdn, inet:url, hash:sha256, inet:dns:a, risk:threat, risk:tool:software, ou:campaign, it:mitre:attack:technique, risk:vuln, meta:source], verbs: [uses, refs, exploits, seen]}
    interaction: passive
    time_semantics: current_state
    cost: {queries: 1, expected_ms: 300}
    max_results: 500
    implementation: {storm: "$n = $lib.pivot.input() $n | tee { -> * } { <- * } { -(*)> * } { <(*)- * }"}
  - name: tags_for
    description: Reputation and assessment tags on a node (#rep.*, #cno.*, #cti.conf.*, #tlp.*).
    accepts: [inet:ipv4, inet:fqdn, inet:url, hash:sha256]
    emits: {forms: [syn:tag]}
    interaction: passive
    time_semantics: current_state
    cost: {queries: 1, expected_ms: 100}
    max_results: 100
