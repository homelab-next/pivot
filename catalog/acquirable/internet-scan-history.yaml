schema: pivot.connector/1
id: internet-scan-history
version: 0.1.0
title: Internet-wide scan history
tier: acquirable
description: 'Turns one AWS IP into a fleet: C2 frameworks and actor-built images leave reusable fingerprints.
  History matters because the IP is gone tomorrow.'
kind: api
egress: external
independence_group: internet-scanners
handling:
  default_tlp: amber
acquisition:
  path: freemium
  cost_band: $$
  examples:
  - Shodan
  - Censys
  - Validin host responses
  - Netlas
  - FOFA
  - ZoomEye
  lead_time: days
methods:
- name: ip_to_fingerprints
  description: 'What the host served while the actor held it: TLS cert, JARM, JA4S, SSH host key, favicon
    hash, HTTP headers.'
  prior_hit_rate: 0.8
  accepts:
  - inet:ipv4
  emits:
    forms:
    - crypto:x509:cert
    - inet:ssl:jarmhash
    - inet:tls:ja4s
    - crypto:key
    - _pivot:http:favicon_mmh3
  interaction: passive
  time_semantics: windowed
  cost:
    queries: 1
    expected_ms: 5000
  max_results: 500
- name: fingerprint_to_ips
  description: Every other host serving the same cert / SSH key / favicon / C2 framework fingerprint.
    A reused SSH host key across EC2 instances is close to an operator signature.
  prior_hit_rate: 0.6
  accepts:
  - crypto:x509:cert
  - inet:ssl:jarmhash
  - inet:tls:ja4s
  - crypto:key
  - _pivot:http:favicon_mmh3
  emits:
    forms:
    - inet:ipv4
  interaction: passive
  time_semantics: windowed
  cost:
    queries: 1
    expected_ms: 5000
  max_results: 500
